[package]
name = "libfw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared data structures, traits and protocol constants for libfw"
keywords = ["transfer", "streaming", "storage", "http", "range"]
categories = ["network-programming", "compression"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zrip.workspace = true
sha2.workspace = true
async-trait.workspace = true
# `path-encrypt` feature: EncryptedPathCodec (AES-256-GCM shadow paths).
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { workspace = true, features = ["js"], optional = true }

[features]
default = []
path-encrypt = ["dep:aes-gcm", "dep:base64", "dep:getrandom"]

[dev-dependencies]
zstd = "0.13"
