[package]
name = "libfw-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "libfw client: native Rust client + WASM engine + JS SDK"
keywords = ["wasm", "browser", "upload", "download", "resumable"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libfw-core.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
futures.workspace = true
serde.workspace = true
console_error_panic_hook = "0.1"
serde_json.workspace = true
thiserror.workspace = true
zrip.workspace = true

# Keep the web-sys surface minimal and explicit.
web-sys = { workspace = true, features = [
    "Window",
    "Storage",
    "AbortController",
    "AbortSignal",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
    "XmlHttpRequestEventTarget",
    "ProgressEvent",
    "console",
] }

# Native (non-WASM) HTTP transport for `native::NativeClient`.
#
# Declared per-target so a `wasm32` build (wasm-pack / the npm package) never
# even resolves them: the browser engine uses `fetch`/XHR instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "stream",
    "rustls-tls-native-roots",
] }
tokio = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Native-client integration tests run a real libfw server over TCP.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
libfw-server = { workspace = true }
axum.workspace = true
tempfile = "3"
