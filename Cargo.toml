[workspace]
resolver = "3"
members = [
    "crates/libfw-core",
    "crates/libfw-server",
    "crates/libfw-client",
    "examples/axum-server",
    "examples/actix-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/libfw"
description = "High-performance streaming file & folder transfer library for Rust"

[workspace.dependencies]
libfw-core = { path = "crates/libfw-core" }
libfw-server = { path = "crates/libfw-server" }
libfw-client = { path = "crates/libfw-client" }

# Core / shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zrip = { version = "0.8", features = ["frame"] }

# Server (axum integration example)
axum = { version = "0.8", features = ["http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
bytes = "1"
async-trait = "0.1"
futures = "0.3"
sha2 = "0.10"
time = "0.3"

# Client (WASM)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
# Example servers
actix-web = "4"
actix-rt = "2"

getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
