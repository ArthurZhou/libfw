name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only, do not publish (default: true)'
        type: boolean
        default: true
      version:
        description: 'Version to stamp into sdk/package.json (empty = keep current)'
        type: string
        required: false

# Least privilege for the whole workflow. The npm job adds `id-token: write`
# on top of this so it can mint a short-lived OIDC token at publish time.
permissions:
  contents: read

jobs:
  # ── Publish Rust crates to crates.io (order: core → server → client) ────────
  # Only runs on a real GitHub Release; a manual dispatch skips it.
  publish-crates:
    name: Publish Rust crates
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Publish libfw-core first (no libfw dependencies)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p libfw-core --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish libfw-server (depends on libfw-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p libfw-server --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish libfw-client last (depends on libfw-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p libfw-client --token "$CARGO_REGISTRY_TOKEN"

  # ── Build WASM engine + publish the JS SDK to npm ───────────────────────────
  # Authenticates via OIDC "trusted publishing": no NPM_TOKEN, no secret to
  # rotate. See docs/releasing.md for the one-time setup on npmjs.com.
  publish-npm:
    name: Publish NPM package
    runs-on: ubuntu-latest
    needs: publish-crates
    if: always() && (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    permissions:
      contents: read
      # Required: lets GitHub mint the OIDC token npm exchanges for a
      # short-lived publish credential. Without this, npm publish gets ENEEDAUTH.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          # NOTE: deliberately no `registry-url` here. setup-node writes a
          # placeholder `_authToken` into .npmrc when it is set, npm then
          # prefers token auth and the OIDC exchange silently never happens.
          package-manager-cache: false

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM engine into sdk/pkg
        run: |
          rm -rf sdk/pkg
          wasm-pack build crates/libfw-client --target web --out-dir ../../sdk/pkg --release

      - name: Sync package version with release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # v0.1.0 → 0.1.0
          VER="${INPUT_VERSION:-${TAG_NAME#v}}"
          if [ -z "$VER" ]; then
            VER="$(node -p "require('./sdk/package.json').version")"
          fi
          echo "Publishing version: $VER"
          cd sdk
          npm pkg set version="$VER"

      - name: Publish to npm
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          cd sdk
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: packing only, nothing will be published."
            npm publish --dry-run
          else
            # No NODE_AUTH_TOKEN on purpose — the CLI detects the OIDC
            # environment and authenticates with the workflow-scoped token.
            # Provenance attestation is generated automatically.
            npm publish --access public
          fi
