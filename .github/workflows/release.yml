name: Release

on:
  release:
    types: [published]

jobs:
  # ── Publish Rust crates to crates.io (order: core → server → client) ────────
  publish-crates:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Publish libfw-core first (no libfw dependencies)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p libfw-core --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish libfw-server (depends on libfw-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p libfw-server --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish libfw-client last (depends on libfw-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p libfw-client --token "$CARGO_REGISTRY_TOKEN"

  # ── Build WASM engine + publish the JS SDK to npm ───────────────────────────
  publish-npm:
    name: Publish NPM package
    runs-on: ubuntu-latest
    needs: publish-crates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM engine into sdk/pkg
        run: |
          rm -rf sdk/pkg
          wasm-pack build crates/libfw-client --target web --out-dir ../../sdk/pkg --release

      - name: Sync package version with release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Strip leading 'v' from tag (e.g. v0.1.0 → 0.1.0)
          VER="${VERSION#v}"
          cd sdk
          npm pkg set version="${VER}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk
          npm publish --access public