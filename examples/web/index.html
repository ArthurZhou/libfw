<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>libfw client demo</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 0.6rem 0 0.2rem; font-weight: 600; }
    input[type="text"] { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #log { margin-top: 1rem; padding: 0.6rem; border: 1px solid #8882; border-radius: 6px;
           font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    #bar { height: 10px; background: #8882; border-radius: 5px; overflow: hidden; margin-top: 0.5rem; }
    #fill { height: 100%; width: 0; background: #2f81f7; transition: width 0.15s; }
  </style>
</head>
<body>
  <h1>libfw client demo</h1>
  <p>Run the server first: <code>cargo run -p axum-server -- data 8080</code>.
     Serve this directory (e.g. <code>python -m http.server 5173</code>) and open the page.</p>

  <label for="base">Server base URL</label>
  <input id="base" type="text" value="http://127.0.0.1:8080" />

  <label for="token">Bearer token (dev server accepts <code>dev-token</code>)</label>
  <input id="token" type="text" value="dev-token" />

  <label for="path">Path (empty = root; e.g. <code>dir</code> or <code>dir/a.txt</code>)</label>
  <input id="path" type="text" value="" placeholder="dir  or  dir/a.txt" />

  <div class="row">
    <button id="download">📥 Download folder…</button>
    <button id="downloadFile">📄 Download file…</button>
    <button id="upload">📤 Upload folder…</button>
    <label style="flex-basis:100%">
      Or upload specific files:
      <input id="files" type="file" multiple />
    </label>
  </div>

  <div class="row">
    <button id="pause" disabled>Pause</button>
    <button id="resume" disabled>Resume</button>
    <button id="cancel" disabled>Cancel</button>
  </div>

  <div id="bar"><div id="fill"></div></div>
  <div id="log"></div>

  <script type="module">
    import { LibfwClient } from '../../sdk/index.js';

    const $ = (id) => document.getElementById(id);
    const log = (msg) => {
      $('log').textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + $('log').textContent;
    };
    const setFill = (pct) => { $('fill').style.width = `${Math.round(pct * 100)}%`; };

    const client = new LibfwClient({
      baseUrl: '',
      concurrency: 4,
      compress: true,
      onEvent: (e) => {
        if (e.type === 'progress') {
          setFill(e.total > 0 ? e.done / e.total : 0);
          log(`progress ${e.done}/${e.total} bytes`);
        } else if (e.type === 'fileStart') {
          log(`▶ ${e.path} (${e.total} bytes)`);
        } else if (e.type === 'fileCompleted') {
          log(`✔ ${e.path}`);
        }
      },
    });

    const controls = (active) => {
      $('pause').disabled = !active;
      $('resume').disabled = !active;
      $('cancel').disabled = !active;
    };
    const baseUrl = () => $('base').value.replace(/\/+$/, '');
    const token = () => $('token').value;
    const pathInput = () => $('path').value.trim();

    // Rebuild the client whenever the base URL changes.
    client._options.baseUrl = baseUrl();
    $('base').addEventListener('change', () => {
      client._options.baseUrl = baseUrl();
      log(`base URL → ${client._options.baseUrl}`);
    });

    $('download').addEventListener('click', async () => {
      try {
        controls(true);
        const bytes = await client.downloadFolder(token(), pathInput());
        log(`download complete: ${bytes} bytes`);
      } catch (err) {
        log(`download failed: ${err?.message ?? err}`);
      } finally {
        controls(false);
      }
    });

    $('downloadFile').addEventListener('click', async () => {
      const p = pathInput();
      if (!p) { log('enter a file path first (e.g. dir/a.txt)'); return; }
      try {
        controls(true);
        const bytes = await client.downloadFile(token(), p);
        log(`file download complete: ${bytes} bytes`);
      } catch (err) {
        log(`file download failed: ${err?.message ?? err}`);
      } finally {
        controls(false);
      }
    });

    $('upload').addEventListener('click', async () => {
      try {
        controls(true);
        const bytes = await client.upload(token());
        log(`upload complete: ${bytes} bytes`);
      } catch (err) {
        log(`upload failed: ${err?.message ?? err}`);
      } finally {
        controls(false);
      }
    });

    $('files').addEventListener('change', async () => {
      try {
        controls(true);
        const bytes = await client.upload(token(), $('files').files);
        log(`upload complete: ${bytes} bytes`);
      } catch (err) {
        log(`upload failed: ${err?.message ?? err}`);
      } finally {
        controls(false);
      }
    });

    $('pause').addEventListener('click', () => { client.pause(); log('paused'); });
    $('resume').addEventListener('click', () => { client.resume(); log('resumed'); });
    $('cancel').addEventListener('click', () => { client.cancel(); log('cancelled'); });

    log('ready. Pick a folder or files to start.');
  </script>
</body>
</html>
